name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: json-workbench-vsix
          path: '*.vsix'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-results
          path: |
            test-results/*.json
            test-results/*.png
